name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        react: ['18', '19']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Pin React ${{ matrix.react }}
        if: matrix.react == '18'
        run: npm install --no-save react@18 react-dom@18 @types/react@18 @types/react-dom@18
      - name: Check the React under test
        run: node -e "const v=[require('react/package.json').version,require('react-dom/package.json').version]; console.log(v.join(' ')); if (v.some(x=>!x.startsWith('${{ matrix.react }}.'))) process.exit(1)"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint:package
