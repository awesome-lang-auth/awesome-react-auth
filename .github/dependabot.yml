version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # Dev tooling moves together; one PR a week instead of ten.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # React 18 is tested through the CI matrix, not the lockfile: only the
      # 19.x line belongs in devDependencies.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']
